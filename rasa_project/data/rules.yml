version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Fetch tasks when the user asks for their tasks
  steps:
  - intent: task_info
  - action: utter_task_info

- rule: Fetch file when the user asks for a file
  steps:
  - intent: file_location
  - action: utter_file_location