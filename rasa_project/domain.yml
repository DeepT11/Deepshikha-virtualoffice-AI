version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - task_info
  - file_location

responses:
  utter_greet:
  - text: "Hey! How are you?"

  utter_cheer_up:
  - text: "Here is something to cheer you up:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "Did that help you?"

  utter_happy:
  - text: "Great, carry on!"

  utter_goodbye:
  - text: "Bye"

  utter_iamabot:
  - text: "I am a bot, powered by Rasa."

  utter_meeting:
  - text: "I can help you schedule a meeting."

  utter_task_info:
  - text: "I can help you with your tasks."
  - text: "What do you want to know about your tasks?"

  utter_file_location:
  - text: "I can help you find your file."

  utter_faq:
  - text: "I can help you with frequently asked questions."
  - text: "What do you want to know about the FAQs?"
  

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
